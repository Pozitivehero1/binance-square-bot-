name: DeepSeek bot adapter check

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Repository branch or commit to validate without publishing
        type: string
        default: main

permissions:
  contents: read

concurrency:
  group: deepseek-bot-adapter-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DRY_RUN: "1"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      DEEPSEEK_MODEL_TIMEOUT: "25"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Exercise production startup and author adapter without publishing
        run: |
          python - <<'PY'
          import json
          import time
          import run_bot  # Installs the real startup policies; main() is not called.
          import ai_provider

          assert ai_provider.preferred_provider_name() == "deepseek_local"
          started = time.monotonic()
          result = ai_provider.request_candidates(
              system_prompt='Ты русскоязычный редактор. По вымышленным фактам напиши три коротких разных варианта: обзор, сводка, сопоставление. Верни только JSON {"candidates":[{"format_id":"overview","text":"..."},{"format_id":"brief","text":"..."},{"format_id":"comparison","text":"..."}]}. Не добавляй факты, числа или советы.',
              user_payload={"synthetic_test": True, "facts": ["BTC +2% за сутки", "объём +10%", "ETH без изменений"], "candidate_count": 3},
              temperature=0.4, max_tokens=1000, timeout=25,
          )
          assert result.provider == "deepseek_local"
          assert len(result.candidates) == 3
          texts = [row["text"] for row in result.candidates]
          assert len(set(texts)) == 3
          assert all(any("а" <= ch.lower() <= "я" or ch.lower() == "ё" for ch in text) for text in texts)
          print(json.dumps({"provider": result.provider, "model": result.model, "candidates": len(texts), "latency_ms": round((time.monotonic()-started)*1000), "published": False}))
          PY

