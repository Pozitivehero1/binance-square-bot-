name: Build Windows Desktop EXE

on:
  workflow_dispatch:
  push:
    branches: [desktop-local-ai]
    paths:
      - "desktop_app.py"
      - "desktop_app_qwen4b.py"
      - "desktop_runtime_qwen4b.py"
      - "ollama_native_patch.py"
      - "local_ai_primary.py"
      - "local_ai_runtime.py"
      - "local_ai_test.py"
      - "qwen4b_fixed_test.py"
      - "BinanceSquareBot.spec"
      - "BinanceSquareBotQwen4B.spec"
      - "requirements.txt"
      - ".github/workflows/build_windows_desktop.yml"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.10,<7"

      - name: Compile desktop modules and run local AI tests
        shell: pwsh
        run: |
          python -m py_compile desktop_app.py desktop_app_qwen4b.py desktop_runtime_qwen4b.py ollama_native_patch.py local_ai_primary.py local_ai_runtime.py
          python local_ai_test.py
          python qwen4b_fixed_test.py

      - name: Build unique Qwen3 4B EXE
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm BinanceSquareBotQwen4B.spec
          $exe = "dist\BinanceSquareBot-Qwen3-4B-FIX-R2.exe"
          if (-not (Test-Path $exe)) { throw "EXE was not created: $exe" }
          Get-Item $exe | Select-Object Name,Length

      - name: Upload unique Qwen3 4B EXE
        uses: actions/upload-artifact@v4
        with:
          name: BinanceSquareBot-Qwen3-4B-FIX-R2
          path: dist/BinanceSquareBot-Qwen3-4B-FIX-R2.exe
          if-no-files-found: error
          retention-days: 30
