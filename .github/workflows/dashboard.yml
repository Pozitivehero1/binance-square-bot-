name: Square Analytics Dashboard

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "dashboard_builder.py"
      - "dashboard_version_enrich.py"
      - "collect_stats.py"
      - "VERSION.txt"
      - ".github/workflows/dashboard.yml"
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: square-analytics-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PYTHONUNBUFFERED: "1"
      SQUARE_PROFILE_UID: "6w3LNrVCJ9O4VGhRSf6oug"
      STATS_REFRESH_PAGES: "6"
      LEARNING_ONLY: "0"
      ANALYTICS_TZ_OFFSET: "3"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore latest bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            post_memory.json
            published_history.json
          key: square-state-${{ github.ref_name }}
          restore-keys: |
            square-state-${{ github.ref_name }}-
            square-state-

      - name: Refresh public Square analytics
        run: |
          python collect_stats.py --pages "$STATS_REFRESH_PAGES" --build-dashboard
          python dashboard_version_enrich.py
          test -s dashboard/data.json
          test -s dashboard/summary.json

      - name: Persist live dashboard data
        run: |
          git add dashboard/data.json dashboard/summary.json
          if git diff --cached --quiet; then
            echo "Dashboard analytics unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Update live dashboard analytics [skip ci]"
            # The dashboard can finish while a normal code commit lands on main.
            # Rebase the generated snapshot onto the newest main instead of losing
            # the whole analytics/deploy run to a non-fast-forward push.
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dashboard

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
