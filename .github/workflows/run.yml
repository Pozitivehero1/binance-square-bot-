name: Binance Square Bot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: square-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

      SQUARE_API: ${{ secrets.SQUARE_API }}
      MISTRAL_API: ${{ secrets.MISTRAL_API }}

      DRY_RUN: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Binance Square Skill
        run: |
          npm install -g @antfu/ni
          npx skills add https://github.com/binance/binance-skills-hub --skill square-post -y

      - name: Restore publication memory
        uses: actions/cache@v4
        with:
          path: |
            post_memory.json
            published_history.json
          key: square-memory
          restore-keys: |
            square-memory

      - name: Configuration check
        run: |
          if [ -f config_check.py ]; then
            python config_check.py
          fi

      - name: Self tests
        run: |
          if [ -f self_test.py ]; then
            python self_test.py
          fi

      - name: Run bot
        run: |
          python main.py

      - name: Save publication memory
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            post_memory.json
            published_history.json
          key: square-memory-${{ github.run_id }}