name: Binance Square Bot

on:
  push:
    branches: [main]
    paths:
      - "squarebot/**"
      - "run_bot.py"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and validate without publishing"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: binance-square-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: "1"
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      SQUARE_API: ${{ secrets.SQUARE_API }}
      SQUARE_SKILL_DIR: ${{ github.workspace }}/.agents/skills/square-post
      SQUARE_PROFILE_UID: "6w3LNrVCJ9O4VGhRSf6oug"
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
      DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL || 'deepseek-chat' }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODELS: "qwen/qwen3.8-27b,openai/gpt-oss-120b"
      MISTRAL_API: ${{ secrets.MISTRAL_API }}
      MISTRAL_MODEL: "mistral-small-2603"
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      ORCAROUTER_MODEL: "deepseek/deepseek-v4-pro-free"
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODELS: "nvidia/nemotron-3.5-lightning:free,liquid/lfm-2.5-2.6b:free,openrouter/free"
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      # One explicit author budget shared by all topics, repairs and providers.
      EDITOR_MAX_AI_CALLS: "8"
      EDITOR_AI_SECONDS: "160"
      EDITOR_UNIVERSE_SIZE: "40"
      EDITOR_DATA_WORKERS: "8"
      ENABLE_NEWS_ARTICLES: "1"
      # External cron controls cadence. No global/symbol pacing or view-score gates.
      ENABLE_PACING_LIMITS: "0"
      LEARNING_ONLY: "0"
      STATS_REFRESH_PAGES: "4"
      ANALYTICS_TZ_OFFSET: "3"
      NO_POST_ALERT_HOURS: "6"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Verify editorial engine offline
        run: python editorial_engine_test.py
      - name: Install Square publisher
        run: |
          npx --yes skills add https://github.com/binance/binance-skills-hub --skill square-post -y
          test -f "$SQUARE_SKILL_DIR/scripts/post-text.mjs"
          test -f "$SQUARE_SKILL_DIR/scripts/post-image.mjs"
      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            post_memory.json
            published_history.json
          key: square-state-${{ github.ref_name }}
          restore-keys: |
            square-state-${{ github.ref_name }}-
            square-state-
      - name: Check configuration
        run: python run_bot.py --check
      - name: Refresh Square performance history
        continue-on-error: true
        run: python collect_stats.py --pages "$STATS_REFRESH_PAGES"
      - name: Run editorial engine
        run: python run_bot.py
      - name: Report publication decision
        if: always()
        run: python operations.py
      - name: Upload editorial decision
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editorial-decision-${{ github.run_id }}
          path: |
            state/editorial_report.json
            state/status.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            post_memory.json
            published_history.json
          key: square-state-${{ github.ref_name }}-${{ github.run_id }}
