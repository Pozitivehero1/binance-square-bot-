name: Binance Square Bot

on:
  workflow_dispatch:
  schedule:
    # Native fallback cadence: external cron is no longer a single point of failure.
    - cron: "*/20 * * * *"

permissions:
  contents: read

concurrency:
  group: binance-square-bot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHONUNBUFFERED: "1"

      SQUARE_API: ${{ secrets.SQUARE_API }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      MISTRAL_API: ${{ secrets.MISTRAL_API }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

      DRY_RUN: "0"
      SQUARE_SKILL_DIR: ${{ github.workspace }}/.agents/skills/square-post

      # Adaptive reach + verified outcome learning.
      SQUARE_PROFILE_UID: "6w3LNrVCJ9O4VGhRSf6oug"
      LEARNING_ONLY: "0"
      ENABLE_ADAPTIVE_RANKING: "1"
      ADAPTIVE_MIN_MATURE_SAMPLES: "80"
      ADAPTIVE_LOOKBACK_DAYS: "7"
      ADAPTIVE_HALF_LIFE_DAYS: "3"
      ADAPTIVE_MAX_TOTAL: "14"
      ADAPTIVE_TICKER_MAX: "10"
      ADAPTIVE_HOUR_MAX: "5"
      ADAPTIVE_LANE_MAX: "2.5"
      ADAPTIVE_BREAKOUT_MAX: "3"
      ADAPTIVE_EXPLORATION_MAX: "2.5"
      ADAPTIVE_SATURATION_MAX: "5"
      ADAPTIVE_OUTCOME_MAX: "5"
      ADAPTIVE_OUTCOME_PRIOR: "6"
      ADAPTIVE_OUTCOME_MIN_CLOSED: "3"
      ADAPTIVE_CONTENT_MIN_SAMPLES: "60"
      ADAPTIVE_CONTENT_MAX_TOTAL: "9"
      ADAPTIVE_FORMAT_MAX: "5"
      ADAPTIVE_WRITER_MAX: "2.5"
      ADAPTIVE_EVENT_CLASS_MAX: "2"
      ADAPTIVE_DIRECTION_MAX: "1.5"
      W2E_PROXY_MAX_BONUS: "5"
      W2E_PROXY_MAX_PENALTY: "3"
      STATS_REFRESH_PAGES: "4"
      ANALYTICS_TZ_OFFSET: "3"

      # Cadence is controlled by the 20-minute trigger. Keep hard editorial,
      # fact-lock and publish-safety checks, but do not suppress an otherwise
      # valid post only because the predictive reach score is below a threshold.
      ENABLE_PACING_LIMITS: "0"
      ENABLE_REACH_GATE: "0"
      MIN_REACH_SCORE: "69"
      # Re-open a symbol after two hours instead of four. Text similarity,
      # freshness and market gates still prevent blind repetition.
      COOLDOWN_MIN: "120"

      # AI author chain: Groq is authoritative. Qwen 3.8 27B runs first and
      # GPT-OSS 120B is the second Groq model. Existing Mistral/Orca/OpenRouter
      # providers stay as emergency AI fallbacks. With AI configured,
      # deterministic templates stay disabled instead of silently replacing AI.
      CONTENT_MODE: "ai_author"
      GROQ_BASE_URL: "https://api.groq.com/openai/v1"
      GROQ_MODEL: "qwen/qwen3.8-27b"
      GROQ_BACKUP_MODEL: "openai/gpt-oss-120b"
      GROQ_MODELS: "qwen/qwen3.8-27b,openai/gpt-oss-120b"
      GROQ_RETRIES: "2"
      GROQ_MODEL_TIMEOUT: "25"
      GROQ_RETRY_BASE_SECONDS: "1"
      GROQ_RETRY_CAP_SECONDS: "4"
      GROQ_MAX_RETRY_AFTER: "8"
      GROQ_MAX_TOKENS: "1100"
      GROQ_MISTRAL_FALLBACK_RETRIES: "1"
      ORCAROUTER_BASE_URL: "https://api.orcarouter.ai/v1"
      ORCAROUTER_MODEL: "deepseek/deepseek-v4-pro-free"
      ORCAROUTER_RETRIES: "1"
      ORCAROUTER_RETRY_BASE_SECONDS: "2"
      ORCAROUTER_RETRY_CAP_SECONDS: "6"
      ORCAROUTER_MAX_RETRY_AFTER: "8"
      OPENROUTER_BASE_URL: "https://openrouter.ai/api/v1"
      OPENROUTER_MODEL: "nvidia/nemotron-3.5-lightning:free"
      OPENROUTER_MODELS: "nvidia/nemotron-3.5-lightning:free,liquid/lfm-2.5-2.6b:free,openrouter/free"
      OPENROUTER_RETRIES: "2"
      OPENROUTER_MODEL_TIMEOUT: "20"
      OPENROUTER_RETRY_BASE_SECONDS: "1"
      OPENROUTER_RETRY_CAP_SECONDS: "3"
      OPENROUTER_MAX_RETRY_AFTER: "6"
      MISTRAL_MODEL: "mistral-small-2603"
      MISTRAL_RETRIES: "1"
      MISTRAL_RETRY_BASE_SECONDS: "2"
      MISTRAL_RETRY_CAP_SECONDS: "6"
      MISTRAL_MAX_RETRY_AFTER: "8"
      AI_AUTHOR_REQUIRED: "1"
      AI_VARIANTS: "3"
      AI_RETRIES: "2"
      AI_TEMPERATURE: "0.65"
      MIN_VALID_AI_DRAFTS: "1"
      DETERMINISTIC_COMPARE_SLOTS: "0"
      AI_TIMEOUT: "75"
      AI_MAX_TOKENS: "1400"
      EVENT_AI_VARIANTS: "3"
      EVENT_AI_RETRIES: "2"
      EVENT_AI_TEMPERATURE: "0.65"
      EVENT_MIN_VALID_AI_DRAFTS: "1"
      EVENT_DETERMINISTIC_COMPARE_SLOTS: "0"

      # Editorial controls stay unchanged: higher throughput must come from a
      # larger candidate pool, not from publishing broken or low-quality copy.
      EMOJI_RATE: "0.16"
      QUESTION_EVERY: "9"
      USE_HASHTAGS: "0"
      POST_VARIANTS: "16"
      POST_MIN_CHARS: "220"
      POST_MAX_CHARS: "430"
      MIN_POST_QUALITY: "84"
      MIN_FEED_APPEAL: "76"
      MAX_POST_SIMILARITY: "0.46"
      MIN_CONVERSION_INTENT: "75"

      # Throughput-oriented market selection. These are discovery/ranking gates;
      # final text, fact-lock, live-price and public-plan checks remain strict.
      PRELIM_MIN_SCORE: "34"
      MIN_OPPORTUNITY_SCORE: "60"
      MIN_AUDIENCE_DEMAND: "20"
      MIN_EVENT_SCORE: "56"
      EVENT_W2E_FLOOR: "38"
      EVENT_MIN_DEMAND: "16"
      EVENT_LANE_ADVANTAGE: "0.5"
      EVENT_MIN_POST_QUALITY: "80"
      EVENT_MIN_FEED_APPEAL: "74"
      EVENT_MIN_CONVERSION: "72"
      VALID_PLAN_EVENT_BONUS: "0"
      OBSERVATION_ONLY_EVENT_PENALTY: "0"
      MIN_W2E_MARKET_SCORE: "52"
      W2E_SOFT_FLOOR: "36"
      HOT_W2E_FLOOR: "30"
      STRICT_BTC_FILTER: "0"

      # Public trade plan. Every plan_valid post exposes direction + entry zone
      # + stop + TP1/TP2/TP3. Confirmed-entry remains internal to outcome tracking.
      MIN_PUBLIC_TP3_RR: "1.65"
      MIN_PUBLIC_PLAN_RR: "1.30"
      MAX_PUBLIC_RISK_PCT: "7.0"
      DECISION_NEAR_ATR: "0.24"
      DECISION_NEAR_PCT: "0.20"
      MAX_STRUCTURAL_DISTANCE_ATR: "2.40"
      MAX_STRUCTURAL_DISTANCE_PCT: "4.0"
      PUBLIC_STOP_BUFFER_ATR: "0.75"
      ENTRY_ZONE_ATR: "0.16"
      ENTRY_ZONE_MAX_PCT: "0.35"
      REQUIRE_NEAR_LEVEL_CONFIRMATION: "1"

      # Final-only public outcomes: TP1/TP2/STOP remain internal. Only verified
      # TP3 completion is eligible for a public follow-up by default.
      ENABLE_OUTCOME_ENGINE: "1"
      OUTCOME_AVATAR_PATH: "assets/pozitivehero_avatar.png"
      OUTCOME_AI: "1"
      OUTCOME_POST_STOPS: "0"
      OUTCOME_POST_PARTIAL_TARGETS: "0"
      OUTCOME_PENDING_ENTRY_HOURS: "18"
      OUTCOME_MAX_AGE_HOURS: "72"
      OUTCOME_MIN_FOLLOWUP_GAP_MIN: "45"
      OUTCOME_MAX_FOLLOWUPS_PER_TRADE: "2"
      OUTCOME_MAX_KLINE_PAGES: "7"

      # Wider scan gives each 20-minute cycle more publishable alternatives.
      TOP_SYMBOLS: "180"
      SHORTLIST_SIZE: "54"
      FINAL_CANDIDATES: "30"
      DATA_WORKERS: "10"
      MIN_QUOTE_VOLUME: "5000000"
      PUBLISH_MEDIA_MODE: "chart"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Binance Square Skill
        run: |
          npx --yes skills add \
            https://github.com/binance/binance-skills-hub \
            --skill square-post \
            -y

      - name: Verify Binance Square Skill
        run: |
          echo "Expected skill directory:"
          echo "$SQUARE_SKILL_DIR"

          find "$GITHUB_WORKSPACE" -maxdepth 6 \
            -type f \
            \( -name "post-text.mjs" -o -name "post-image.mjs" \) \
            -print

          if [ ! -f "$SQUARE_SKILL_DIR/scripts/post-text.mjs" ] && \
             [ ! -f "$SQUARE_SKILL_DIR/scripts/post-image.mjs" ]; then
            echo "::error::Binance Square Skill was not installed correctly"
            exit 1
          fi

      - name: Restore bot state
        uses: actions/cache/restore@v4
        with:
          path: |
            state
            post_memory.json
            published_history.json
          key: square-state-${{ github.ref_name }}
          restore-keys: |
            square-state-${{ github.ref_name }}-
            square-state-

      - name: Check configuration
        run: |
          if [ -f config_check.py ]; then
            python config_check.py --publishing
          fi
          python groq_primary.py

      - name: Refresh Square performance history
        continue-on-error: true
        run: |
          python collect_stats.py --pages "$STATS_REFRESH_PAGES"

      - name: Run bot
        run: |
          python run_bot.py

      - name: Save bot state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            state
            post_memory.json
            published_history.json
          key: square-state-${{ github.ref_name }}-${{ github.run_id }}
